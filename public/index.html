<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NJY — ISKCON Thiruppalai</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E4F52">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<section id="view-login" class="center" hidden>
  <div class="card">
    <h2>Sign in</h2>
    <form id="login-form" autocomplete="on" method="post" action="javascript:void(0)">
      <label for="u">Username</label>
      <input id="u" name="username" required autocapitalize="none" autocorrect="off">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" required>
      <p class="error" id="login-err" hidden></p>
      <p style="margin-top:1.2rem"><button class="primary" type="submit">Sign in</button></p>
    </form>
    <p class="hint">Nama-Japa-Yajna coordinators &amp; leaders.<br>
      If you don't have an account, ask the temple president.</p>
  </div>
</section>

<main id="view-app" class="app" hidden>
  <header class="topbar">
    <h1><a href="#/" style="color:inherit;text-decoration:none">NJY</a></h1>
    <div class="who">
      <div class="who-line">
        <strong id="who-name"></strong>
        <span id="who-role"></span>
        <a href="#" id="logout">Sign out</a>
      </div>
      <a href="#/profile" id="pts-chip" class="pts-chip" hidden></a>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <section id="view" aria-live="polite"></section>
</main>

<script src="/assets/app.js" type="module"></script>
</body>
</html>

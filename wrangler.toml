name = "njy-app"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

# D1 binding is intentionally NOT declared here. Each Cloudflare Pages
# project (staging + production, in different accounts) sets its own
# D1 database binding via the Dashboard:
#   Settings → Functions → Bindings → D1 database → variable "DB" →
#   pick the database that lives in that account.
#
# Why: hard-coding database_id would tie wrangler.toml to a single
# account. Removing the block unlocks the Dashboard UI so each
# environment resolves "DB" against its own account's D1.
#
# Local dev + migrations: pass `--config-name njy` or the database
# name directly, e.g.
#   npx wrangler d1 migrations apply njy --remote

[vars]
APP_TZ = "Asia/Kolkata"
OVERDUE_DAYS = "7"

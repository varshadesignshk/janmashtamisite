name = "njy-app"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

# D1 database. Staging account's DB `njy` (ID below). Production uses a
# DIFFERENT wrangler.toml (branched at push time or via env override —
# see PRODUCTION-SETUP.md for the promote-to-prod workflow).
[[d1_databases]]
binding = "DB"
database_name = "njy"
database_id = "ac889cea-b0ca-47f2-ac6c-c4953cb1211a"
migrations_dir = "schema"

# Session secret and VAPID keys are set via `wrangler pages secret put`.
# Do not put secrets in this file.

[vars]
APP_TZ = "Asia/Kolkata"
OVERDUE_DAYS = "7"
